<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#FF6B00;--orL:#FFF4EE;--orB:#FFD9C0;
  --bl:#1681c4;--blL:#eef7ff;--blB:#c2e4ff;
  --gr:#2DAA24;--grL:#F0FEF0;
  --re:#E53935;--reL:#FFF0F0;
  --ye:#D97706;--yeL:#FFFBEB;
  --bg:#FFFFFF;--bg2:#FFF8F4;
  --tx:#1C1C1E;--tx2:#6B6B6B;--tx3:#A0A0A0;
  --ff:'Nunito',sans-serif;--fm:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ff)}
.wrap{display:flex;flex-direction:column;height:100vh;padding:16px;gap:10px}
.hdr{display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:14px;font-weight:900;display:flex;align-items:center;gap:7px}

.result-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg2);border-radius:16px;border:2px solid var(--orB);padding:20px}
.class-result{font-size:42px;font-weight:900;font-family:var(--fm);transition:all .3s}
.formula{font-size:13px;font-weight:700;color:var(--tx3);font-family:var(--fm)}
.formula span{font-weight:900}

.number-line{width:100%;position:relative;height:48px}
.nl-track{position:absolute;top:20px;left:0;right:0;height:6px;background:#F0F0F0;border-radius:3px}
.nl-fill{position:absolute;top:20px;left:0;height:6px;border-radius:3px;transition:width .3s,background .3s}
.nl-threshold{position:absolute;top:8px;width:3px;border-radius:2px;background:#334155;transition:left .3s}
.nl-threshold::after{content:'T';position:absolute;top:-16px;left:-4px;font-size:10px;font-weight:900;color:#334155;font-family:var(--fm)}
.nl-prob{position:absolute;top:8px;width:3px;border-radius:2px;background:var(--or);transition:left .3s}
.nl-prob::after{content:'p';position:absolute;top:-16px;left:-4px;font-size:10px;font-weight:900;color:var(--or);font-family:var(--fm)}

.interpret{border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;text-align:center;transition:all .3s;width:100%}

.ctrls{display:flex;flex-direction:column;gap:8px}
.ctrl{background:var(--bg2);border-radius:12px;padding:12px 14px;border:1px solid var(--orB)}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ctrl-lbl{font-size:12px;font-weight:800;color:var(--tx2)}
.ctrl-val{font-family:var(--fm);font-size:18px;font-weight:700;color:var(--or)}
.ctrl-val.blue{color:var(--bl)}
input[type=range]{width:100%;height:5px;-webkit-appearance:none;appearance:none;background:#FFD9C0;border-radius:3px;outline:none;cursor:pointer}
input[type=range].blue-range{background:#c2e4ff}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--or);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--orB);cursor:pointer}
input[type=range].blue-range::-webkit-slider-thumb{background:var(--bl);box-shadow:0 0 0 2px var(--blB)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-title">🎚️ Threshold 실험기</div>
  </div>

  <div class="result-card">
    <div class="class-result" id="classResult">클래스 1</div>
    <div class="formula" id="formula"></div>
    <div class="number-line">
      <div class="nl-track"></div>
      <div class="nl-fill" id="nlFill"></div>
      <div class="nl-threshold" id="nlThreshold"></div>
      <div class="nl-prob" id="nlProb"></div>
    </div>
    <div class="interpret" id="interpret"></div>
  </div>

  <div class="ctrls">
    <div class="ctrl">
      <div class="ctrl-row">
        <span class="ctrl-lbl">🟠 모델 출력 확률 p</span>
        <span class="ctrl-val" id="pVal">0.50</span>
      </div>
      <input type="range" id="sliderP" min="0.01" max="0.99" step="0.01" value="0.50">
    </div>
    <div class="ctrl">
      <div class="ctrl-row">
        <span class="ctrl-lbl">🔵 Threshold</span>
        <span class="ctrl-val blue" id="tVal">0.50</span>
      </div>
      <input type="range" class="blue-range" id="sliderT" min="0.10" max="0.90" step="0.01" value="0.50">
    </div>
  </div>
</div>

<script>
const sliderP = document.getElementById('sliderP');
const sliderT = document.getElementById('sliderT');

function update(){
  const p = parseFloat(sliderP.value);
  const t = parseFloat(sliderT.value);
  const pStr = p.toFixed(2);
  const tStr = t.toFixed(2);
  const isClass1 = p >= t;

  document.getElementById('pVal').textContent = pStr;
  document.getElementById('tVal').textContent = tStr;

  const res = document.getElementById('classResult');
  const interp = document.getElementById('interpret');
  const formula = document.getElementById('formula');

  formula.innerHTML = `<span style="color:var(--or)">${pStr}</span> ${isClass1 ? '≥' : '<'} <span style="color:var(--bl)">${tStr}</span> → ${isClass1 ? '클래스 1' : '클래스 0'}`;

  if(isClass1){
    res.textContent = '클래스 1 (양성)';
    res.style.color = '#FF6B00';
    interp.style.background = '#FFF4EE';
    interp.style.border = '1.5px solid #FFD9C0';
    interp.style.color = '#E55A00';
    interp.textContent = `p(${pStr}) ≥ threshold(${tStr}) → 클래스 1로 예측`;
  } else {
    res.textContent = '클래스 0 (음성)';
    res.style.color = '#1681c4';
    interp.style.background = '#eef7ff';
    interp.style.border = '1.5px solid #c2e4ff';
    interp.style.color = '#1681c4';
    interp.textContent = `p(${pStr}) < threshold(${tStr}) → 클래스 0으로 예측`;
  }

  // Number line
  document.getElementById('nlFill').style.width = (p*100)+'%';
  document.getElementById('nlFill').style.background = isClass1 ? '#FF6B00' : '#1681c4';
  document.getElementById('nlProb').style.left = `calc(${p*100}% - 1.5px)`;
  document.getElementById('nlThreshold').style.left = `calc(${t*100}% - 1.5px)`;
}

sliderP.addEventListener('input', update);
sliderT.addEventListener('input', update);
update();
</script>
</body>
</html>
