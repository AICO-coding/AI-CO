<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#FF6B00;--orL:#FFF4EE;--orB:#FFD9C0;
  --bl:#1681c4;--blL:#eef7ff;--blB:#c2e4ff;
  --gr:#2DAA24;--grL:#F0FEF0;
  --re:#E53935;--reL:#FFF0F0;
  --bg:#FFFFFF;--bg2:#FFF8F4;
  --tx:#1C1C1E;--tx2:#6B6B6B;--tx3:#A0A0A0;
  --ff:'Nunito',sans-serif;--fm:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ff)}
.wrap{display:flex;flex-direction:column;height:100vh;padding:16px;gap:10px}
.hdr{font-size:14px;font-weight:900;display:flex;align-items:center;gap:7px}

.chart-area{flex:1;background:var(--bg2);border-radius:16px;border:2px solid var(--orB);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.chart-label{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);font-family:var(--fm)}
canvas{width:100%!important;flex:1;min-height:0;border-radius:8px}

.result-row{display:flex;gap:10px}
.result-box{flex:1;background:var(--bg2);border-radius:12px;border:2px solid var(--orB);padding:12px;text-align:center}
.result-lbl{font-size:11px;font-weight:800;color:var(--tx3);margin-bottom:4px}
.result-val{font-family:var(--fm);font-size:22px;font-weight:700;transition:color .3s}
.result-sub{font-size:11px;color:var(--tx3);margin-top:2px}

.interpret{border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;text-align:center;transition:all .3s}

.ctrl{background:var(--bg2);border-radius:12px;padding:12px 14px;border:1px solid var(--orB)}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ctrl-lbl{font-size:12px;font-weight:800;color:var(--tx2)}
.ctrl-val{font-family:var(--fm);font-size:20px;font-weight:700;color:var(--or)}
input[type=range]{width:100%;height:5px;-webkit-appearance:none;appearance:none;background:#FFD9C0;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:var(--or);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--orB);cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:10px;font-family:var(--fm);color:var(--tx3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">📈 Sigmoid 함수 시각화</div>

  <div class="chart-area">
    <div class="chart-label"><span>σ(z)</span><span>z 범위: -10 ~ 10</span></div>
    <canvas id="chart"></canvas>
  </div>

  <div class="result-row">
    <div class="result-box">
      <div class="result-lbl">입력값 z</div>
      <div class="result-val" id="zVal" style="color:var(--or)">0.0</div>
    </div>
    <div class="result-box">
      <div class="result-lbl">σ(z) 출력값</div>
      <div class="result-val" id="sigVal">0.500</div>
      <div class="result-sub">항상 0~1 사이</div>
    </div>
  </div>

  <div class="interpret" id="interpret"></div>

  <div class="ctrl">
    <div class="ctrl-row">
      <span class="ctrl-lbl">입력값 z (선형 변환 w·X + b 결과)</span>
      <span class="ctrl-val" id="ctrlVal">0.0</span>
    </div>
    <input type="range" id="slider" min="-10" max="10" step="0.1" value="0">
    <div class="ticks"><span>-10</span><span>-5</span><span>0</span><span>5</span><span>10</span></div>
  </div>
</div>

<script>
const slider = document.getElementById('slider');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');

function sigmoid(z){ return 1/(1+Math.exp(-z)); }

function drawChart(zCurrent){
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr;
  canvas.height = rect.height*dpr;
  ctx.scale(dpr,dpr);
  const W=rect.width, H=rect.height;
  const pad={t:8,r:8,b:8,l:8};
  const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;

  ctx.fillStyle='#FFF8F4';
  ctx.fillRect(0,0,W,H);

  // Grid lines
  [0,0.25,0.5,0.75,1].forEach(v=>{
    const y=pad.t+cH*(1-v);
    ctx.strokeStyle='#FFD9C0';
    ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cW,y); ctx.stroke();
  });

  // 0.5 line
  const midY = pad.t+cH*0.5;
  ctx.strokeStyle='rgba(22,129,196,0.3)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(pad.l,midY); ctx.lineTo(pad.l+cW,midY); ctx.stroke();
  ctx.setLineDash([]);

  // Sigmoid curve
  ctx.beginPath();
  ctx.strokeStyle='#FF6B00';
  ctx.lineWidth=2.5;
  for(let i=0;i<=cW;i++){
    const z = -10 + (i/cW)*20;
    const s = sigmoid(z);
    const x = pad.l+i;
    const y = pad.t+cH*(1-s);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();

  // Current point
  const cx = pad.l+((zCurrent+10)/20)*cW;
  const cy = pad.t+cH*(1-sigmoid(zCurrent));
  ctx.beginPath();
  ctx.arc(cx,cy,6,0,Math.PI*2);
  ctx.fillStyle='#FF6B00';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx,cy,6,0,Math.PI*2);
  ctx.strokeStyle='#fff';
  ctx.lineWidth=2;
  ctx.stroke();

  // Dotted lines to axes
  ctx.strokeStyle='rgba(255,107,0,0.4)';
  ctx.lineWidth=1;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,pad.t+cH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(pad.l,cy); ctx.stroke();
  ctx.setLineDash([]);
}

function update(){
  const z = parseFloat(slider.value);
  const s = sigmoid(z);
  const zStr = z.toFixed(1);
  const sStr = s.toFixed(3);

  document.getElementById('ctrlVal').textContent = zStr;
  document.getElementById('zVal').textContent = zStr;
  document.getElementById('sigVal').textContent = sStr;

  drawChart(z);

  const interp = document.getElementById('interpret');
  const sigEl = document.getElementById('sigVal');

  if(s >= 0.9){
    sigEl.style.color='#FF6B00';
    interp.style.background='#FFF4EE'; interp.style.border='1.5px solid #FFD9C0'; interp.style.color='#E55A00';
    interp.textContent=`z = ${zStr} → σ(z) ≈ ${sStr} → 1에 가까움 → 클래스 1 강하게 확신`;
  } else if(s >= 0.6){
    sigEl.style.color='#FF6B00';
    interp.style.background='#FFF4EE'; interp.style.border='1.5px solid #FFD9C0'; interp.style.color='#E55A00';
    interp.textContent=`z = ${zStr} → σ(z) = ${sStr} → 클래스 1 쪽으로 기울어짐`;
  } else if(s >= 0.4){
    sigEl.style.color='#D97706';
    interp.style.background='#FFFBEB'; interp.style.border='1.5px solid #FCD88A'; interp.style.color='#B45309';
    interp.textContent=`z = ${zStr} → σ(z) = ${sStr} ≈ 0.5 → 모델이 판단을 못 내리는 상태`;
  } else if(s >= 0.1){
    sigEl.style.color='#1681c4';
    interp.style.background='#eef7ff'; interp.style.border='1.5px solid #c2e4ff'; interp.style.color='#1681c4';
    interp.textContent=`z = ${zStr} → σ(z) = ${sStr} → 클래스 0 쪽으로 기울어짐`;
  } else {
    sigEl.style.color='#1681c4';
    interp.style.background='#eef7ff'; interp.style.border='1.5px solid #c2e4ff'; interp.style.color='#1681c4';
    interp.textContent=`z = ${zStr} → σ(z) ≈ ${sStr} → 0에 가까움 → 클래스 0 강하게 확신`;
  }
}

slider.addEventListener('input', update);
window.addEventListener('resize', ()=>drawChart(parseFloat(slider.value)));
update();
</script>
</body>
</html>
