<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>배치 학습 개념도</title>
  <desc>전체 데이터를 미니배치로 나눠 DataLoader가 모델에 공급하는 학습 흐름</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
    .th  { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .ts  { font-size: 12px; font-weight: 400; fill: #444441; }
  </style>

  <!-- 전체 데이터셋 -->
  <rect x="30" y="40" width="148" height="260" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="104" y="62" text-anchor="middle" dominant-baseline="central">Dataset</text>
  <text class="ts" x="104" y="78" text-anchor="middle" dominant-baseline="central">150개 샘플</text>

  <rect x="44" y="92"  width="120" height="28" rx="4" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text class="ts" x="104" y="106" text-anchor="middle" dominant-baseline="central">batch 1  · 32개</text>

  <rect x="44" y="126" width="120" height="28" rx="4" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text class="ts" x="104" y="140" text-anchor="middle" dominant-baseline="central">batch 2  · 32개</text>

  <rect x="44" y="160" width="120" height="28" rx="4" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text class="ts" x="104" y="174" text-anchor="middle" dominant-baseline="central">batch 3  · 32개</text>

  <rect x="44" y="194" width="120" height="28" rx="4" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text class="ts" x="104" y="208" text-anchor="middle" dominant-baseline="central">batch 4  · 32개</text>

  <rect x="44" y="228" width="120" height="28" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text class="ts" x="104" y="242" text-anchor="middle" dominant-baseline="central">batch 5  · 22개</text>

  <text class="ts" x="104" y="280" text-anchor="middle">5 step / epoch</text>

  <!-- DataLoader 화살표 -->
  <line x1="178" y1="170" x2="236" y2="170" stroke="#639922" stroke-width="1.2" marker-end="url(#arr)"/>
  <text class="ts" x="207" y="158" text-anchor="middle">DataLoader</text>
  <text class="ts" x="207" y="172" text-anchor="middle">batch_size=32</text>
  <text class="ts" x="207" y="186" text-anchor="middle">shuffle=True</text>

  <!-- 미니배치 -->
  <rect x="238" y="132" width="136" height="76" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="306" y="158" text-anchor="middle" dominant-baseline="central">미니배치</text>
  <text class="ts" x="306" y="176" text-anchor="middle" dominant-baseline="central">Xb: (32, 3)</text>
  <text class="ts" x="306" y="192" text-anchor="middle" dominant-baseline="central">yb: (32, 1)</text>

  <!-- 배치 → 모델 -->
  <line x1="374" y1="170" x2="432" y2="170" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 학습 스텝 박스 -->
  <rect x="434" y="80" width="210" height="180" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="539" y="108" text-anchor="middle" dominant-baseline="central">1 step 학습</text>

  <rect x="452" y="124" width="174" height="28" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="539" y="138" text-anchor="middle" dominant-baseline="central">pred = model(Xb)</text>

  <rect x="452" y="158" width="174" height="28" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="539" y="172" text-anchor="middle" dominant-baseline="central">loss = crit(pred, yb)</text>

  <rect x="452" y="192" width="174" height="28" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="539" y="206" text-anchor="middle" dominant-baseline="central">backward + step</text>

  <!-- 1 epoch 표시 -->
  <rect x="30" y="302" width="614" height="28" rx="4" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="337" y="316" text-anchor="middle" dominant-baseline="central">1 epoch = 전체 배치를 한 바퀴 돌기 (5 step) · epoch을 수백 번 반복해서 loss를 줄여요</text>
</svg>
